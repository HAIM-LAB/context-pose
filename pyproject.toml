[project]
name = "cvpr"
version = "0.1.0"
description = "ASD-ContextPose: event-conditioned pose regression"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
